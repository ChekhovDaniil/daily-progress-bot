[project]
name = "daily-progress-bot"
version = "0.1.0"
description = "A daily task tracking bot"
requires-python = ">=3.9"
dependencies = [
    "dateparser>=1.2,<2",
    "pyTelegramBotAPI>=4,<5",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
